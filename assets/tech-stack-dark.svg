      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <style>
    .card, .glow { transform-box: fill-box; transform-origin: center; }
    .card { animation: float 3.6s ease-in-out infinite; }
    .glow { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: .85; } }
    @media (prefers-reduced-motion: reduce) { .card, .glow { animation: none; } }
  </style>
