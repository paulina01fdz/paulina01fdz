<svg xmlns="http://www.w3.org/2000/svg" width="1182" height="182" viewBox="0 0 1182 182" role="img" aria-labelledby="title desc">
  <title id="title">Stack tecnológico de Paulina Fernández — modo oscuro</title>
  <desc id="desc">Once logos de tecnologías dentro de tarjetas oscuras redondeadas, con bordes y resplandor en tonos morado, azul y cian. Las tarjetas flamean suavemente y el resplandor pulsa.</desc>
