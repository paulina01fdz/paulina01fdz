<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Paulina Fernández Hernández — Desarrolladora de software</title>
  <desc id="desc">Banner oscuro con una interfaz de terminal, una cuadrícula tecnológica y acentos violeta y cian.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10121f"/>
      <stop offset="1" stop-color="#17122b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a99bff"/>
      <stop offset="1" stop-color="#69e1e8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b8b2ff" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#background)"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>
  <circle cx="1070" cy="80" r="155" fill="#7957ff" opacity=".12"/>
  <circle cx="1055" cy="78" r="102" fill="none" stroke="#a99bff" stroke-opacity=".24"/>
  <circle cx="1055" cy="78" r="72" fill="none" stroke="#69e1e8" stroke-opacity=".3" stroke-dasharray="3 8"/>
  <path d="M0 292C220 257 364 332 556 289s346-47 644 1" fill="none" stroke="url(#accent)" stroke-opacity=".34"/>
  <rect x="48" y="46" width="60" height="4" rx="2" fill="url(#accent)"/>
  <text x="48" y="91" fill="#a99bff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="3">PAULINA FERNÁNDEZ HERNÁNDEZ</text>
  <text x="46" y="159" fill="#f3f1ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="48" font-weight="700" letter-spacing="-1.5">Construyo ideas</text>
  <text x="46" y="215" fill="#f3f1ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="48" font-weight="700" letter-spacing="-1.5">que cobran vida <tspan fill="url(#accent)">en código.</tspan></text>
  <text x="49" y="257" fill="#c1bfd2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">Desarrolladora de software junior · Medellín, Colombia</text>
  <text x="49" y="296" fill="#8e8aa7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">WEB DEVELOPMENT  /  LEARNING  /  BUILDING</text>
  <g transform="translate(755 116)">
    <rect width="385" height="154" rx="14" fill="#0c0d16" fill-opacity=".92" stroke="#8f83d6" stroke-opacity=".36"/>
    <path d="M0 39h385" stroke="#8f83d6" stroke-opacity=".24"/>
    <circle cx="20" cy="20" r="5" fill="#ff7b72"/>
    <circle cx="38" cy="20" r="5" fill="#f4c15d"/>
    <circle cx="56" cy="20" r="5" fill="#56d6a5"/>
    <text x="23" y="70" fill="#69e1e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">$</text>
    <text x="43" y="70" fill="#e1def2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">building useful things</text>
    <text x="23" y="101" fill="#a99bff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">const</text>
    <text x="77" y="101" fill="#e1def2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">nextStep = "keep learning";</text>
    <text x="23" y="132" fill="#56d6a5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">✓ ready to collaborate</text>
    <rect x="223" y="119" width="8" height="17" rx="1" fill="#69e1e8" filter="url(#glow)">
      <animate attributeName="opacity" values="1;.2;1" dur="1.3s" repeatCount="indefinite"/>
    </rect>
  </g>
  <circle cx="704" cy="91" r="3" fill="#69e1e8" filter="url(#glow)"/>
  <circle cx="1149" cy="293" r="3" fill="#a99bff" filter="url(#glow)"/>
</svg>
